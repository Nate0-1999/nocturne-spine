name: CI

on:
  pull_request:
  push:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Build distributions and rebuild wheel from sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/nocturne-spine-sdist-wheel dist/nocturne_spine-0.1.0.tar.gz
      - name: Installed wheel smoke
        run: |
          python -m venv /tmp/nocturne-spine-wheel-smoke
          /tmp/nocturne-spine-wheel-smoke/bin/python -m pip install dist/nocturne_spine-*.whl
          cd /tmp
          /tmp/nocturne-spine-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/verify_wheel.py"
